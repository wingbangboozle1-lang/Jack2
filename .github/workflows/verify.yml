name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate the historical root projection model
        run: python3 tools/model.py

      - name: Build current evidence ledger, normalized model and dashboard
        run: |
          python3 session-f4f700c0/scripts/build_research.py
          python3 session-f4f700c0/scripts/analyze.py
          python3 session-f4f700c0/scripts/build_site.py

      - name: Rebuild the historical root site and current landing
        run: python3 tools/build_site.py

      - name: Line-level repository inventory and privacy scan
        run: python3 session-f4f700c0/scripts/audit.py

      - name: Verify current dashboard data, model, links and privacy
        run: python3 session-f4f700c0/scripts/check.py

      - name: Run current model unit tests
        run: python3 -m unittest discover -s session-f4f700c0/tests -v

      - name: Run historical root link, source, PII and consistency checks
        run: python3 tools/check_site.py

      - name: Export the historical manual-review ledger
        run: python3 tools/export_ledger.py

      - name: Regenerate and verify the session-4ed347de workbook
        run: |
          python3 session-4ed347de/scripts/model.py
          python3 session-4ed347de/scripts/build_site.py
          python3 session-4ed347de/scripts/verify.py

      - name: Regenerate and verify session-343c7030 dashboard
        run: |
          python3 session-343c7030/scripts/model.py
          python3 session-343c7030/scripts/build_site.py
          python3 session-343c7030/scripts/verify.py

      - name: Regenerate and verify session-a3a8ec08 dashboard
        run: |
          python3 session-a3a8ec08/scripts/projection_engine.py
          python3 session-a3a8ec08/scripts/build_site.py
          python3 session-a3a8ec08/scripts/verify_all.py

      - name: Regenerate and verify session-313ba936 (Session M) dashboard
        run: |
          python3 session-313ba936/scripts/model.py
          python3 session-313ba936/scripts/build_site.py
          python3 session-313ba936/scripts/verify.py
          if [ -n "$(git status --porcelain -- session-313ba936/)" ]; then
            echo "Session M (session-313ba936) generated output is out of date."
            git status --porcelain -- session-313ba936/
            git diff --stat -- session-313ba936/
            exit 1
          fi

      - name: Regenerate and verify the session-3090b9ed (Session N4) dashboard
