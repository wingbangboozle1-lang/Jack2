name: verify-node-dashboard

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify curated research is reproducible
        run: |
          python research/assemble.py
          git diff --exit-code -- data/research.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build, test and verify
        run: npm run check
      - name: Fail if committed dossier is out of date
        run: git diff --exit-code -- session-50002478
