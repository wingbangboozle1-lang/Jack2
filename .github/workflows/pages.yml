name: deploy privacy-reviewed Pages artifact

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the verified main-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-run verification and stage the exact Pages allowlist
        run: |
          set -euo pipefail
          python3 canonical/model.py
          python3 canonical/review_repo.py
          python3 canonical/verify.py
          python3 canonical/sanitize.py --check
          python3 -m unittest discover -s canonical/tests -v
          python3 canonical/publish.py --out "$RUNNER_TEMP/published-site"

      - name: Confirm GitHub Actions is the Pages publishing source
        # The workflow token cannot change the Pages build type (HTTP 403 on PUT).
        # The repository owner sets it once in Settings > Pages (or with an admin token).
        # This step only reads the current value and fails loudly if it is not "workflow".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          if [ "$build_type" != workflow ]; then
            echo "::error::Pages build_type is '$build_type'. Set Settings > Pages > Source to GitHub Actions, then re-run."
            exit 1
          fi
          echo "Pages build_type is workflow"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the privacy-reviewed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/published-site
          include-hidden-files: true # The reviewed allowlist includes only .nojekyll as a dotfile.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
