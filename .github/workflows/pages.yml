name: deploy privacy-reviewed Pages artifact

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the verified main-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-run verification and stage the exact Pages allowlist
        run: |
          set -euo pipefail
          python3 canonical/model.py
          python3 canonical/review_repo.py
          python3 canonical/verify.py
          python3 canonical/sanitize.py --check
          python3 -m unittest discover -s canonical/tests -v
          python3 canonical/publish.py --out "$RUNNER_TEMP/published-site"

      - name: Select GitHub Actions as the Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --jq .build_type)"
          test "$build_type" = workflow

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the privacy-reviewed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/published-site
          include-hidden-files: true # The reviewed allowlist includes only .nojekyll as a dotfile.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
